name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            runner: windows-latest
          - arch: arm64
            goarch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Arch ${{ matrix.goarch }} -Test -Short

      - name: Package
        shell: pwsh
        run: |
          $dist = 'dist'
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item AirPlay2Audio.exe, AirPlay2Engine.exe, Start-Console.cmd, LICENSE, README.md, README.zh-CN.md -Destination $dist
          Copy-Item third-party-licenses -Destination $dist -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: AirPlay2Audio-windows-${{ matrix.arch }}
          path: dist

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip packages
        working-directory: artifacts
        run: |
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../${name}-${GITHUB_REF_NAME}.zip" .)
          done
          ls -l *.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags such as v1.2.3-rc.1 are published as pre-releases.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
